<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Music Player</title>
  <style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f2027; /* dark blue gradient background */
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  color: #fff;
}
.player {
  background: #1c1c1c;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  width: 380px;
}
.cover {
  width: 100%;
  height: 200px;
  border-radius: 10px;
  margin-bottom: 15px;
  background-size: cover;
  background-position: center;
}
.info h3 {
  margin: 5px 0;
  font-size: 1.3rem;
  color: #00c6ff; /* bright blue accent */
}
.info p {
  margin: 0;
  color: #ccc;
  font-size: 0.9rem;
}
button {
  padding: 12px;
  font-size: 1.1rem;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: #00c6ff;
  color: #000;
  transition: transform 0.2s, background 0.3s;
}
button:hover {
  background: #0072ff;
  transform: scale(1.1);
}
.progress, .volume {
  width: 100%;
  margin: 10px 0;
  accent-color: #00c6ff;
}
.playlist {
  margin-top: 20px;
  max-height: 150px;
  overflow-y: auto;
  border-top: 1px solid #333;
  padding-top: 10px;
}
.playlist div {
  padding: 8px;
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.3s;
}
.playlist div:hover {
  background: #2c5364;
}
.active-song {
  background: #00c6ff;
  color: #000;
}
  </style>
</head>
<body>

<div class="player">
  <div class="info">
    <h3 id="title">Song Title</h3>
    <p id="artist">Artist Name</p>
    <p id="duration">0:00 / 0:00</p>
  </div>

  <audio id="audio"></audio>

  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">▶️/⏸</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <input type="range" id="progress" class="progress" value="0" step="1">
  <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="0.5">

  <div class="playlist" id="playlist"></div>
</div>

<script>
  const songs = [
    { title: "Tum Hi Ho", artist: "Arijit Singh", src: "tumhiho.mp3", duration: "4:22" },
    { title: "Channa Mereya", artist: "Arijit Singh", src: "channa.mp3", duration: "5:05" },
    { title: "Kesariya", artist: "Arijit Singh", src: "kesariya.mp3", duration: "3:52" },
    { title: "Mile ho tum hamko", artist: "Neha Kakkar", src: "Mile ho tum hamko.mp3", duration: "4:45" }
  ];

  let currentIndex = 0;
  const audio = document.getElementById('audio');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const duration = document.getElementById('duration');
  const progress = document.getElementById('progress');
  const volume = document.getElementById('volume');
  const playlist = document.getElementById('playlist');

  function loadSong(index) {
    const song = songs[index];
    audio.src = song.src;
    title.textContent = song.title;
    artist.textContent = song.artist;
    duration.textContent = "0:00 / " + song.duration;
    audio.load();
    highlightSong(index);
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }

  function nextSong() {
    currentIndex = (currentIndex + 1) % songs.length;
    loadSong(currentIndex);
    audio.play();
  }

  function prevSong() {
    currentIndex = (currentIndex - 1 + songs.length) % songs.length;
    loadSong(currentIndex);
    audio.play();
  }

  audio.addEventListener('timeupdate', () => {
    progress.max = audio.duration;
    progress.value = audio.currentTime;
    duration.textContent = formatTime(audio.currentTime) + " / " + songs[currentIndex].duration;
  });

  progress.addEventListener('input', () => {
    audio.currentTime = progress.value;
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value;
  });

  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return minutes + ":" + (secs < 10 ? "0" : "") + secs;
  }

  function buildPlaylist() {
    playlist.innerHTML = "";
    songs.forEach((song, index) => {
      const div = document.createElement("div");
      div.textContent = song.title + " - " + song.artist + " (" + song.duration + ")";
      div.onclick = () => {
        currentIndex = index;
        loadSong(index);
        audio.play();
      };
      playlist.appendChild(div);
    });
    highlightSong(currentIndex);
  }

  function highlightSong(index) {
    [...playlist.children].forEach((child, i) => {
      child.classList.toggle("active-song", i === index);
    });
  }

  // Load first song and build playlist
  loadSong(currentIndex);
  buildPlaylist();
</script>

</body>
</html>
